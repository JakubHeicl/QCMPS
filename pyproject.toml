[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcmps"
version = "0.1.0"
description = "Quantum circuit matrix product state experiments"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "qiskit",
    "qiskit-nature",
]

[tool.setuptools.packages.find]
include = ["qcmps*", "experiments*"]
